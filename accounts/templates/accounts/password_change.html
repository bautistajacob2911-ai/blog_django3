{% extends 'posts/base.html' %}

{% block titulo %}Cambiar contraseña · Mi Blog{% endblock %}

{% block contenido %}
<h1 class="seccion-titulo">Cambiar contraseña</h1>
<p class="seccion-intro">Ingresá tu contraseña actual y elegí una nueva.</p>

<form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="formulario-acciones">
        <button type="submit" class="boton-solido">Cambiar contraseña</button>
        <a class="boton" href="{% url 'accounts:perfil' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
